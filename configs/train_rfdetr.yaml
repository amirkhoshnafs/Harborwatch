# configs/train_rfdetr.yaml

project:
  name: harborwatch
  run_name: harborwatch_rfdetr_nano_baseline_v1

dataset:
  dataset_dir: data/processed/harborwatch_rfdetr_coco_v1
  num_classes: 3
  class_names:
    - large_vessel
    - buoy
    - small_craft

model:
  family: rfdetr
  size: nano

train:
  epochs: 30
  batch_size: 1
  grad_accum_steps: 16
  lr: 1e-4
  output_dir: outputs/train/harborwatch_rfdetr_nano_baseline_v1

runtime:
  seed: 42
  device_preference: cuda